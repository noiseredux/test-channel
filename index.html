<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What Should Noiseredux Play?</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ps-blue: #003087;
            --ps-blue-light: #0070cc;
            --nin-red: #e4000f;
            --bg: #f4f4f9;
            --text: #111118;
            --text-muted: #8888aa;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        header { background: linear-gradient(135deg, var(--ps-blue) 0%, #001a4d 100%); border-bottom: 4px solid var(--nin-red); padding: 3rem 1.5rem; text-align: center; }
        header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 7vw, 4.2rem); color: #fff; line-height: 0.9; text-transform: uppercase; margin: 0; }
        .version-tag { font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: #ffffff; opacity: 0.8; margin-top: 0.75rem; font-weight: 500; }
        .controls { background: #e2e2ea; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .controls select { padding: 8px 20px; font-weight: 700; border: 2px solid var(--ps-blue); border-radius: 4px; color: var(--ps-blue); cursor: pointer; }
        .loading { text-align: center; padding: 80px; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--ps-blue); }
        .games-grid { display: flex; flex-direction: column; gap: 12px; padding: 30px; max-width: 900px; margin: 0 auto; }
        .game-card { background: white; border: 1px solid #dcdce8; border-radius: 8px; display: flex; align-items: center; padding: 14px; gap: 20px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
        .game-card:hover { transform: translateX(8px); border-color: var(--ps-blue-light); }
        .game-rank { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--ps-blue); min-width: 65px; text-align: center; }
        .game-image-container { width: 70px; height: 94px; background: #eee; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .game-image { width: 100%; height: 100%; object-fit: cover; }
        .game-title { font-weight: 700; font-size: 1.2rem; color: var(--text); }
        .engagement-value { color: var(--nin-red); font-weight: 700; }
        .score-breakdown { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .platform-tag { background: #edf2f7; color: #4a5568; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; margin-right: 5px; text-transform: uppercase; font-weight: 700; border: 1px solid #cbd5e0; }
        footer { padding: 50px; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid #e2e2ea; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>What Should Noiseredux Play?</h1>
            <p class="version-tag">Version 10.0.1</p>
        </header>
        <div class="controls">
            <label>Select Year:</label>
            <select id="yearSelect"></select>
        </div>
        <div id="content"></div>
        <footer>
            Built by noiseredux &nbsp;·&nbsp; Data powered by IGDB <br>
            A personal index for Sony, Nintendo, and Apple collectors — through the lens of a lifelong fanboy.
        </footer>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3_IE8KU_qeQ4JCgTnoaF1w--vPUemtxHjW5Aq3aF_cUN8eqmYny7xlAlbT-wMp4Qj/exec';

        const ALLOWED_PLATFORMS = [75, 14, 39, 18, 99, 19, 58, 4, 21, 5, 41, 130, 508, 33, 22, 24, 20, 37, 27, 53, 59, 68, 117, 78, 57, 123, 87, 7, 8, 9, 48, 167, 165, 38, 46, 51, 77, 121, 306, 86, 150, 29, 30, 64, 35];
        const PLATFORM_NAMES = { 75: 'A2', 14: 'Mac', 39: 'iOS', 18: 'NES', 99: 'FC', 19: 'SNES', 58: 'SFC', 4: 'N64', 21: 'GC', 5: 'Wii', 41: 'WiiU', 130: 'NS', 508: 'NS2', 33: 'GB', 22: 'GBC', 24: 'GBA', 20: 'DS', 37: '3DS', 27: 'MSX', 53: 'MSX2', 59: '2600', 68: 'CV', 117: 'CDi', 78: 'SCD', 57: 'WS', 123: 'WSC', 87: 'VB', 7: 'PS1', 8: 'PS2', 9: 'PS3', 48: 'PS4', 167: 'PS5', 165: 'PSVR', 38: 'PSP', 46: 'PSV', 51: 'FDS', 77: 'X1', 121: 'X68k', 306: 'SV', 86: 'TG16', 150: 'TGCD', 29: 'SG', 30: '32X', 64: 'SMS', 35: 'GG' };

        // IGDB Category Blacklist: 1=DLC, 2=Expansion, 3=Bundle, 4=Standalone Expansion, 5=Mod, 6=Episode, 7=Season
        const BLACKLISTED_CATEGORIES = [1, 2, 3, 4, 5, 6, 7];

        // --- v10.0.1 scoring engine ---
        // Everything from the old hype/multiplier system (platform boosts,
        // publisher/developer affiliate lists, franchise IP boosts, sport/
        // mainstream/major-league multipliers, Critical Darling percentile
        // blend, etc.) has been removed. This version ranks purely on user
        // score and critic score, each confidence-weighted by how many
        // reviews back it up, using the classic IMDb-style Bayesian average:
        //
        //   weighted = (count / (count + m)) * rating + (m / (count + m)) * baseline
        //
        // v10.0.0 bug (fixed here): `m` and the prior mean were computed
        // from that same year's own pool of reviewed games. Early in a year
        // (or in any sparse pool) the only titles with any reviews at all
        // tend to be hyped, high-scoring releases — so the "mean" being
        // shrunk toward was itself ~85-88, and a 2-review game barely moved
        // (Love Eternal at 88/2 critic reviews was still landing at #1
        // ahead of Resident Evil Requiem's 325 user + 6 critic reviews).
        // Shrinking toward a biased, equally-thin sample doesn't buy real
        // confidence discipline.
        //
        // Fix: `m` (how many reviews it takes to be mostly trusted) and the
        // baseline (what a totally unproven game is assumed to be worth) are
        // now fixed constants, independent of any single year's sample size
        // or composition. Critic review counts on IGDB run much lower than
        // user counts even for fully-reviewed AAA titles, hence the lower
        // critic threshold.
        const CRITIC_PRIOR_COUNT = 15;   // critic reviews needed to be ~mostly trusted on its own
        const USER_PRIOR_COUNT = 50;     // user ratings needed to be ~mostly trusted on its own
        const BASELINE_RATING = 70;      // neutral score assumed for a review-less/thin-evidence game

        function weightedAxisScore(game, ratingKey, countKey, priorCount) {
            // Guard against IGDB entries that carry a rating but a missing/zero
            // count (a known data quirk) — treat as a single review rather than
            // dropping real rating data.
            const count = game[countKey] > 0 ? game[countKey] : (game[ratingKey] > 0 ? 1 : 0);
            if (count <= 0) return null;
            const confidence = count / (count + priorCount); // 0-1, how much to trust this axis's own number
            const weighted = confidence * game[ratingKey] + (1 - confidence) * BASELINE_RATING;
            return { weighted, confidence };
        }

        function populateYearDropdown() {
            const select = document.getElementById('yearSelect');
            for (let year = 2026; year >= 1977; year--) {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = year;
                select.appendChild(opt);
            }
        }

        function displayGames(gamesList) {
            const content = document.getElementById('content');

            let filtered = gamesList.filter(game => {
                const isCorrectPlatform = game.platforms.some(id => ALLOWED_PLATFORMS.includes(id));
                const isBlacklistedCategory = game.category && BLACKLISTED_CATEGORIES.includes(game.category);
                return isCorrectPlatform && !isBlacklistedCategory;
            });

            if (!filtered.length) {
                content.innerHTML = '<div class="loading">No records found for this year.</div>';
                return;
            }

            filtered.forEach(game => {
                const userResult = weightedAxisScore(game, 'rating', 'ratingCount', USER_PRIOR_COUNT);
                const criticResult = weightedAxisScore(game, 'aggregatedRating', 'aggregatedRatingCount', CRITIC_PRIOR_COUNT);

                game.user_score = userResult ? userResult.weighted : null;
                game.critic_score = criticResult ? criticResult.weighted : null;

                // Blend the two axes by their own confidence rather than a
                // flat 50/50 split, so an axis backed by hundreds of reviews
                // properly outweighs one backed by a handful.
                if (userResult && criticResult) {
                    const totalConfidence = userResult.confidence + criticResult.confidence;
                    game.final_score = totalConfidence > 0
                        ? (userResult.weighted * userResult.confidence + criticResult.weighted * criticResult.confidence) / totalConfidence
                        : (userResult.weighted + criticResult.weighted) / 2;
                } else if (userResult) {
                    game.final_score = userResult.weighted;
                } else if (criticResult) {
                    game.final_score = criticResult.weighted;
                } else {
                    game.final_score = null;
                }
            });

            filtered = filtered.filter(game => game.final_score !== null);

            if (!filtered.length) {
                content.innerHTML = '<div class="loading">No reviewed titles found for this year.</div>';
                return;
            }

            filtered.sort((a, b) => b.final_score - a.final_score);

            const grid = document.createElement('div');
            grid.className = 'games-grid';

            filtered.forEach((game, index) => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `https://www.igdb.com/games/${game.slug}`;
                card.target = '_blank';
                const coverUrl = game.cover ? `https://images.igdb.com/igdb/image/upload/t_cover_small/${game.cover}.jpg` : '';

                const breakdownParts = [];
                if (game.user_score !== null) {
                    breakdownParts.push(`User ${Math.round(game.user_score)} (${game.ratingCount || 0})`);
                }
                if (game.critic_score !== null) {
                    breakdownParts.push(`Critic ${Math.round(game.critic_score)} (${game.aggregatedRatingCount || 0})`);
                }

                card.innerHTML = `
                    <div class="game-rank">#${index + 1}</div>
                    <div class="game-image-container">${game.cover ? `<img class="game-image" src="${coverUrl}" alt="${game.name} cover">` : ''}</div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted); text-transform:uppercase;">
                            Score: <span class="engagement-value">${Math.round(game.final_score)}</span>
                        </div>
                        <div class="score-breakdown">${breakdownParts.join(' &nbsp;·&nbsp; ')}</div>
                        <div style="margin-top: 4px;">
                            ${game.platforms.filter(id => ALLOWED_PLATFORMS.includes(id)).map(id => `<span class="platform-tag">${PLATFORM_NAMES[id] || id}</span>`).join('')}
                        </div>
                    </div>`;
                grid.appendChild(card);
            });

            content.innerHTML = '';
            content.appendChild(grid);
        }

        async function loadGames(year) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading Index...</div>';
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?year=${year}&_cb=${Date.now()}`);
                const data = await response.json();
                displayGames(data.games || []);
            } catch (e) {
                console.error(e);
                content.innerHTML = `<div class="loading" style="color:red">System Connection Error.</div>`;
            }
        }

        populateYearDropdown();
        document.getElementById('yearSelect').addEventListener('change', e => loadGames(e.target.value));
        loadGames(2026);
    </script>
</body>
</html>
