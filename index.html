<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What Should Noiseredux Play?</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ps-blue: #003087;
            --ps-blue-light: #0070cc;
            --nin-red: #e4000f;
            --bg: #f4f4f9;
            --text: #111118;
            --text-muted: #8888aa;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        header { background: linear-gradient(135deg, var(--ps-blue) 0%, #001a4d 100%); border-bottom: 4px solid var(--nin-red); padding: 3rem 1.5rem; text-align: center; }
        header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 7vw, 4.2rem); color: #fff; line-height: 0.9; text-transform: uppercase; margin: 0; }
        .version-tag { font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: #ffffff; opacity: 0.8; margin-top: 0.75rem; font-weight: 500; }
        .controls { background: #e2e2ea; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .controls select { padding: 8px 20px; font-weight: 700; border: 2px solid var(--ps-blue); border-radius: 4px; color: var(--ps-blue); cursor: pointer; }
        .loading { text-align: center; padding: 80px; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--ps-blue); }
        .games-grid { display: flex; flex-direction: column; gap: 12px; padding: 30px; max-width: 900px; margin: 0 auto; }
        .game-card { background: white; border: 1px solid #dcdce8; border-radius: 8px; display: flex; align-items: center; padding: 14px; gap: 20px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
        .game-card:hover { transform: translateX(8px); border-color: var(--ps-blue-light); }
        .game-rank { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--ps-blue); min-width: 65px; text-align: center; }
        .game-image-container { width: 70px; height: 94px; background: #eee; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .game-image { width: 100%; height: 100%; object-fit: cover; }
        .game-title { font-weight: 700; font-size: 1.2rem; color: var(--text); }
        .engagement-value { color: var(--nin-red); font-weight: 700; }
        .platform-tag { background: #edf2f7; color: #4a5568; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; margin-right: 5px; text-transform: uppercase; font-weight: 700; border: 1px solid #cbd5e0; }
        footer { padding: 50px; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid #e2e2ea; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>What Should Noiseredux Play?</h1>
            <p class="version-tag">Version 7.2.9</p>
        </header>
        <div class="controls">
            <label>Select Year:</label>
            <select id="yearSelect"></select>
        </div>
        <div id="content"></div>
        <footer>
            Built by noiseredux &nbsp;·&nbsp; Data powered by IGDB <br>
            A personal hype index for Sony, Nintendo, and Apple collectors — through the lens of a lifelong fanboy.
        </footer>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3_IE8KU_qeQ4JCgTnoaF1w--vPUemtxHjW5Aq3aF_cUN8eqmYny7xlAlbT-wMp4Qj/exec';

        const ALLOWED_PLATFORMS = [75, 14, 39, 18, 99, 19, 58, 4, 21, 5, 41, 130, 508, 33, 22, 24, 20, 37, 27, 53, 59, 68, 117, 78, 57, 123, 87, 7, 8, 9, 48, 167, 165, 38, 46, 51, 77, 121, 306, 86, 150, 29, 30, 64, 35];
        const PLATFORM_NAMES = { 75: 'A2', 14: 'Mac', 39: 'iOS', 18: 'NES', 99: 'FC', 19: 'SNES', 58: 'SFC', 4: 'N64', 21: 'GC', 5: 'Wii', 41: 'WiiU', 130: 'NS', 508: 'NS2', 33: 'GB', 22: 'GBC', 24: 'GBA', 20: 'DS', 37: '3DS', 27: 'MSX', 53: 'MSX2', 59: '2600', 68: 'CV', 117: 'CDi', 78: 'SCD', 57: 'WS', 123: 'WSC', 87: 'VB', 7: 'PS1', 8: 'PS2', 9: 'PS3', 48: 'PS4', 167: 'PS5', 165: 'PSVR', 38: 'PSP', 46: 'PSV', 51: 'FDS', 77: 'X1', 121: 'X68k', 306: 'SV', 86: 'TG16', 150: 'TGCD', 29: 'SG', 30: '32X', 64: 'SMS', 35: 'GG' };

        const GENRE_SPORT_ID = 14;
        const SPORT_MULTIPLIER = 2.5;
        const AFFILIATED_MULTIPLIER = 3.75;
        const AWARD_MULTIPLIER = 1.2;
        const CRITICAL_DARLING_REVIEWS_THRESHOLD = 100;
        const CRITICAL_DARLING_MULTIPLIER = 1.5;
        const PILLAR_PUBLISHERS = ['square', 'enix', 'capcom', 'konami'];
        const PILLAR_MULTIPLIER = 1.5;
        const NINTENDO_IP_SLUGS = ['mario', 'zelda', 'hyrule', 'metroid', 'kirby', 'donkey-kong', 'star-fox', 'starlink'];
        const NINTENDO_IP_MULTIPLIER = 5.0;
        const CDI_PLATFORM_ID = 117;
        const CDI_NINTENDO_SLUGS = ['zelda', 'mario', 'link'];
        const CDI_MULTIPLIER = 33.0;
        const VB_PLATFORM_ID = 87;
        const VB_MULTIPLIER = 4.0;
        const WS_PLATFORM_IDS = [57, 123];
        const WS_MULTIPLIER = 20.0;
        const DIGITAL_PICTURES_DEVELOPERS = ['digital pictures'];
        const DIGITAL_PICTURES_MULTIPLIER = 22.0;
        const MAJOR_LEAGUE_TITLE_SLUGS = ['madden', 'mlb-the-show', 'nhl-', 'nascar', 'ea-sports-college-football', 'pga-tour-2k'];
        const MAJOR_LEAGUE_MULTIPLIER = 6.5;

        const AFFILIATED_PUBLISHERS = [
            'nintendo', 'hal laboratory', 'hal america', 'game freak', 'monolith soft', 'retro studios', 'intelligent systems', 'creatures inc', 'nd cube', 'grezzo', 'camelot', 'alphadream', 'brownie brown', '1-up studio', 'jupiter corporation', 'ambrella', 'skip ltd', 'rare', 'rareware', 'hudson soft', 'hudson entertainment', 'ape inc', 'tose', 'arzest', 'syn sophia', 'arika', 'ganbarion', 'genius sonority', 'paon', 'treasure', 'mistwalker', 'next level games', 'vanpool', 'good-feel', 'mercurysteam', 'koei tecmo', 'omega force', 'team ninja', 'platinumgames', 'sony', 'csg imagesoft', 'sony imagesoft', 'apple', 'rac7', 'cbs electronics', 'cbs software', 'psygnosis', 'studio liverpool', 'guerrilla games', 'naughty dog', 'insomniac games', 'sucker punch', 'media molecule', 'evolution studios', 'polyphony digital', 'japan studio', 'team asobi', 'bend studio', 'san diego studio', 'zipper interactive', 'bigbig studios', 'ready at dawn', 'firesprite', 'housemarque', 'bluepoint games', 'nixxes software', 'bungie', 'arrowhead', 'kojima productions', 'shift up', 'fromsoftware', 'sumo digital', 'ember lab', 'media.vision', 'supermassive games', 'quantic dream', 'clap hanz', 'thatgamecompany', 'novarama', 'relentless software', 'game republic', 'eurocom', 'ballistic moon', 'superbot entertainment', 'malibu interactive', 'core design', 'ringler studios', 'absolute entertainment', 'imagineering', "traveller's tales", 'kogado', 'software creations', 'probe software', 'probe entertainment', 'acclaim studios london', 'acclaim cheltenham', 'sensible software', 'spidersoft', 'motivetime', 'outside directors', 'park place productions', 'sting entertainment', 'tiertex', 'teque', 'ocean software', 'ukiyotei', 'propaganda code', 'bits studios', 'bits studio', 'teeny weeny games', 'perfect 10 productions', 'perfect entertainment', 'factor 5', 'kitty group', 'technos japan', 'nicalis', 'flying tiger', 'mecc', 'broderbund', 'sierra', 'infocom', 'epyx', 'sublogic', 'muse software', 'ubisoft'
        ];
        const AFFILIATED_DEVELOPERS = AFFILIATED_PUBLISHERS;
        const NAMCO_PUBLISHERS = ['namco', 'bandai namco'];
        const NAMCO_DEVELOPERS = ['wolf team'];
        const NAMCO_MULTIPLIER = 1.5;
        const MAINSTREAM_TITLE_SLUGS = ['call-of-duty', 'madden'];
        const MAINSTREAM_MULTIPLIER = 2.0;
        const BLACKLISTED_CATEGORIES = [1, 2, 3, 4, 5, 6, 7];

        function populateYearDropdown() {
            const select = document.getElementById('yearSelect');
            for (let year = 2026; year >= 1977; year--) {
                const opt = document.createElement('option');
                opt.value = year; 
                opt.textContent = year;
                select.appendChild(opt);
            }
            select.addEventListener('change', (e) => fetchGamesForYear(e.target.value));
            fetchGamesForYear(select.value);
        }

        function isMainstreamTitle(game) { return typeof game.slug === 'string' && MAINSTREAM_TITLE_SLUGS.some(keyword => game.slug.includes(keyword)); }
        function isMajorLeagueTitle(game) { return typeof game.slug === 'string' && MAJOR_LEAGUE_TITLE_SLUGS.some(keyword => game.slug.includes(keyword)); }
        function isNamcoTitle(game) {
            const pubMatch = Array.isArray(game.publishers) && game.publishers.some(pub => typeof pub === 'string' && NAMCO_PUBLISHERS.some(n => pub.toLowerCase().includes(n)));
            const devMatch = Array.isArray(game.developers) && game.developers.some(dev => typeof dev === 'string' && NAMCO_DEVELOPERS.some(n => dev.toLowerCase().includes(n)));
            return pubMatch || devMatch;
        }
        function isAffiliatedPublisher(game) {
            const pubMatch = Array.isArray(game.publishers) && game.publishers.some(pub => typeof pub === 'string' && AFFILIATED_PUBLISHERS.some(aff => pub.toLowerCase().includes(aff)));
            const devMatch = Array.isArray(game.developers) && game.developers.some(dev => typeof dev === 'string' && AFFILIATED_DEVELOPERS.some(aff => dev.toLowerCase().includes(aff)));
            return pubMatch || devMatch;
        }
        function isPillarTitle(game) {
            const pubMatch = Array.isArray(game.publishers) && game.publishers.some(pub => typeof pub === 'string' && PILLAR_PUBLISHERS.some(p => pub.toLowerCase().includes(p)));
            const devMatch = Array.isArray(game.developers) && game.developers.some(dev => typeof dev === 'string' && PILLAR_PUBLISHERS.some(p => dev.toLowerCase().includes(p)));
            return pubMatch || devMatch;
        }
        function isDigitalPicturesTitle(game) { return Array.isArray(game.developers) && game.developers.some(dev => typeof dev === 'string' && DIGITAL_PICTURES_DEVELOPERS.some(d => dev.toLowerCase().includes(d))); }
        function isCDiNintendoTitle(game) { return Array.isArray(game.platforms) && typeof game.slug === 'string' && game.platforms.includes(CDI_PLATFORM_ID) && CDI_NINTENDO_SLUGS.some(s => game.slug.includes(s)); }
        function isVirtualBoyTitle(game) { return Array.isArray(game.platforms) && game.platforms.includes(VB_PLATFORM_ID); }
        function isWonderSwanTitle(game) { return Array.isArray(game.platforms) && game.platforms.some(p => WS_PLATFORM_IDS.includes(p)); }
        function isNintendoIPTitle(game) { return typeof game.slug === 'string' && NINTENDO_IP_SLUGS.some(s => game.slug.includes(s)); }
        function isCriticalDarling(game) { return (game.reviews || 0) >= CRITICAL_DARLING_REVIEWS_THRESHOLD; }

        async function fetchGamesForYear(year) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="loading">Loading ${year} Hype Index...</div>`;

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?year=${year}`);
                let data = await response.json();
                
                // --- THE CRITICAL FIX: Robustly unpack GAS responses ---
                // 1. If GAS double-stringified the JSON, parse it back into an object/array
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch(e) { console.warn("Failed to parse stringified response."); }
                }

                let gamesArray = null;

                // 2. Locate the actual array (whether it's direct or wrapped in an object like { data: [...] })
                if (Array.isArray(data)) {
                    gamesArray = data;
                } else if (data && typeof data === 'object') {
                    // Search for common wrapper properties
                    const keysToCheck = ['data', 'games', 'items', 'result', 'body'];
                    for (const key of keysToCheck) {
                        if (Array.isArray(data[key])) {
                            gamesArray = data[key];
                            break;
                        }
                    }
                    // If still not found, check every property just in case
                    if (!gamesArray) {
                        for (const key in data) {
                            if (Array.isArray(data[key])) {
                                gamesArray = data[key];
                                break;
                            }
                        }
                    }
                    // Handle a case where the body property itself is a stringified array
                    if (!gamesArray && typeof data.body === 'string') {
                        try {
                            const parsedBody = JSON.parse(data.body);
                            if (Array.isArray(parsedBody)) gamesArray = parsedBody;
                        } catch(e) {}
                    }
                }

                if (!Array.isArray(gamesArray)) {
                    throw new Error("Could not extract games array from the response data.");
                }

                displayGames(gamesArray);

            } catch (err) {
                console.error(`Error loading/processing data for ${year}:`, err);
                content.innerHTML = `<div class="loading" style="color:var(--nin-red);">Error loading data for ${year}. Check the console for details.</div>`;
            }
        }

        function displayGames(gamesList) {
            const content = document.getElementById('content');

            let filtered = gamesList.filter(game => {
                const isCorrectPlatform = Array.isArray(game.platforms) && game.platforms.some(id => ALLOWED_PLATFORMS.includes(id));
                const isBlacklistedCategory = game.category !== undefined && BLACKLISTED_CATEGORIES.includes(game.category);
                return isCorrectPlatform && !isBlacklistedCategory;
            });

            filtered.forEach(game => {
                let score = ((game.reviews || 0) * 3) + (game.follows || 0) + (game.hypes || 0);
                let hasMajorBoost = false;

                if (Array.isArray(game.genres) && game.genres.includes(GENRE_SPORT_ID)) { score = Math.round(score * SPORT_MULTIPLIER); hasMajorBoost = true; }
                if (isMajorLeagueTitle(game)) { score = Math.round(score * MAJOR_LEAGUE_MULTIPLIER); hasMajorBoost = true; }
                if (isMainstreamTitle(game)) { score = Math.round(score * MAINSTREAM_MULTIPLIER); hasMajorBoost = true; }
                if (isAffiliatedPublisher(game)) { score = Math.round(score * AFFILIATED_MULTIPLIER); hasMajorBoost = true; }
                if (isNamcoTitle(game)) { score = Math.round(score * NAMCO_MULTIPLIER); hasMajorBoost = true; }
                if (Array.isArray(game.keywords) && game.keywords.some(k => typeof k === 'string' && k.toLowerCase().includes('award'))) { score = Math.round(score * AWARD_MULTIPLIER); }
                if (isPillarTitle(game)) { score = Math.round(score * PILLAR_MULTIPLIER); hasMajorBoost = true; }
                if (isCDiNintendoTitle(game)) { score = Math.round(score * CDI_MULTIPLIER); hasMajorBoost = true; }
                if (isVirtualBoyTitle(game)) { score = Math.round(score * VB_MULTIPLIER); hasMajorBoost = true; }
                if (isWonderSwanTitle(game)) { score = Math.round(score * WS_MULTIPLIER); hasMajorBoost = true; }
                if (isNintendoIPTitle(game) && !isAffiliatedPublisher(game)) { score = Math.round(score * NINTENDO_IP_MULTIPLIER); hasMajorBoost = true; }
                if (isDigitalPicturesTitle(game)) { score = Math.round(score * DIGITAL_PICTURES_MULTIPLIER); hasMajorBoost = true; }
                if (!hasMajorBoost && isCriticalDarling(game)) { score = Math.round(score * CRITICAL_DARLING_MULTIPLIER); }

                game.calculatedScore = score;
            });

            filtered.sort((a, b) => b.calculatedScore - a.calculatedScore);

            if (filtered.length === 0) {
                content.innerHTML = `<div class="loading">No games found for this year.</div>`;
                return;
            }

            let html = '<div class="games-grid">';
            filtered.forEach((game, index) => {
                const rank = index + 1;
                const coverUrl = game.coverUrl || 'https://images.igdb.com/igdb/image/upload/t_cover_small/nocover.png';
                const platformsText = Array.isArray(game.platforms) ? game.platforms.map(id => PLATFORM_NAMES[id] || id).join(' ') : '';

                html += `
                    <a href="${game.url || '#'}" target="_blank" class="game-card">
                        <div class="game-rank">#${rank}</div>
                        <div class="game-image-container">
                            <img src="${coverUrl}" class="game-image" alt="${game.name || 'Game'}" loading="lazy">
                        </div>
                        <div style="flex-grow: 1;">
                            <div style="margin-bottom: 4px;">
                                <span class="platform-tag">${platformsText}</span>
                            </div>
                            <div class="game-title">${game.name || 'Unknown Title'}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                                Hype Index: <span class="engagement-value">${game.calculatedScore}</span>
                            </div>
                        </div>
                    </a>
                `;
            });
            html += '</div>';

            content.innerHTML = html;
        }

        populateYearDropdown();
    </script>
</body>
</html>
